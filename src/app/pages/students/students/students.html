<app-page-container>
  <app-page-header [title]="config.title"></app-page-header>

  @if (data$ | async; as data) {
    <app-shared-table [data]="data" [columnsConfig]="config.columns" [tableTitle]="config.title"
      [templates]="{ name: nameTmpl, actions: actionsTmpl }"
      [emptyMessage]="hasError ? 'Ops! Ocorreu um erro ao buscar alunos.' : 'Nenhum aluno cadastrado.'" [canAdd]="true"
      [searchPlaceholder]="'Buscar por alunos, responsáveis, email ou telefone'"
      (add)="onAdd()"></app-shared-table>
  } @else {
    <div class="loading-spinner">
      <app-music-loader text="Carregando alunos..." size="lg"></app-music-loader>
    </div>
  }
</app-page-container>

<ng-template #nameTmpl let-element>
  {{ element.firstName }} {{ element.lastName }}
</ng-template>

<ng-template #actionsTmpl let-element>
  <div class="action-buttons">
    <button mat-icon-button (click)="onView(element)" title="Visualizar">
      <mat-icon>visibility</mat-icon>
    </button>
    <button mat-icon-button color="warn" (click)="onDelete(element)" title="Excluir">
      <mat-icon>delete</mat-icon>
    </button>
  </div>
</ng-template>
