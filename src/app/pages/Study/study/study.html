<div class="study-page">
  <app-study-header
    [state]="viewModel().header"
    (loadById)="loadStudy($event)"
    (backToExamples)="backToExamples()"
    (selectExample)="selectExampleFromEmptyState($event)"
  ></app-study-header>

  <div class="study-layout">
    <mat-drawer-container class="instrument-drawer-container">
      <mat-drawer
        #drawer
        class="instrument-drawer"
        mode="over"
        position="start"
        [opened]="!viewModel().player.instrument.instrumentCardCollapsed"
        (openedChange)="setInstrumentCardCollapsed(!$event)"
      >
        <div class="instrument-drawer-header">
          <span>Instrumentos</span>
          <button mat-icon-button type="button" (click)="drawer.close()">
            <mat-icon>close</mat-icon>
          </button>
        </div>
        <app-study-instrument-panel
          [state]="viewModel().player.instrument"
          [loading]="viewModel().player.loading"
          [xmlLoaded]="viewModel().score.xmlLoaded"
          (instrumentCardCollapsedChange)="setInstrumentCardCollapsed($event)"
          (toggleInstrument)="toggleInstrument($event.id, $event.checked)"
          (selectOnlyInstrument)="selectOnlyInstrument($event)"
          (selectAllInstruments)="selectAllInstruments()"
          (restoreAppliedInstruments)="restoreAppliedInstruments()"
          (applySelectedInstruments)="applySelectedInstruments()"
          (cancelInstrumentSelection)="cancelInstrumentSelection()"
          (openInstrumentSelection)="openInstrumentSelection()"
        ></app-study-instrument-panel>
      </mat-drawer>

      <mat-drawer-content>
        @if (xmlLoaded) {
          <button
            mat-stroked-button
            type="button"
            class="instrument-toggle"
            (click)="drawer.toggle()"
          >
            <mat-icon>{{ drawer.opened ? 'chevron_left' : 'chevron_right' }}</mat-icon>
            <span>Instrumentos</span>
          </button>
        }
        <div class="study-main">
      @if (xmlLoaded) {
        <app-study-player-panel
          [state]="viewModel().player"
          (play)="play()"
          (pause)="pause()"
          (stop)="stop()"
          (togglePlayerExpanded)="togglePlayerExpanded()"
          (setTempo)="setTempo($event)"
          (toggleMetronome)="toggleMetronome()"
          (setMetronomeVolume)="setMetronomeVolume($event)"
          (toggleLoop)="toggleLoop()"
          (applyLoop)="applyLoop()"
          (loopStartMeasureChange)="setLoopStartMeasure($event)"
          (loopEndMeasureChange)="setLoopEndMeasure($event)"
        ></app-study-player-panel>
      }

      @if (xmlLoaded || scoreLoading || selectedExampleId) {
        <app-study-score-panel
          [state]="viewModel().score"
          [loading]="viewModel().player.loading"
          [xmlLoaded]="viewModel().score.xmlLoaded"
          (toggleFullscreen)="toggleFullscreenScore()"
        ></app-study-score-panel>
      }
        </div>
      </mat-drawer-content>
    </mat-drawer-container>
  </div>
</div>
