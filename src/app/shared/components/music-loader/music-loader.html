<div class="music-loader" [class.is-sm]="size === 'sm'" [class.is-md]="size === 'md'" [class.is-lg]="size === 'lg'">
  <span class="note">♪</span>
  <span class="note">♫</span>
  <span class="note">♩</span>
  <span class="note">♪</span>
</div>
@if (text) {
  <div class="loading-text" [class.is-sm]="size === 'sm'" [class.is-md]="size === 'md'" [class.is-lg]="size === 'lg'">
    {{ text }}
  </div>
}
